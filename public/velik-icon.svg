<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldVL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="30%" stop-color="#C9A84C"/>
      <stop offset="60%" stop-color="#E8D5A3"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#E8D5A3"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="512" height="512" fill="white"/>

  <!-- Gold frame border -->
  <rect x="64" y="64" width="384" height="384" rx="4"
        fill="none" stroke="url(#goldFrame)" stroke-width="3"/>

  <!-- VL letters -->
  <text
    x="148"
    y="310"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="220"
    font-weight="400"
    fill="url(#goldVL)"
    letter-spacing="-12"
  >VL</text>

  <!-- Beauty House text -->
  <text
    x="256"
    y="375"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="38"
    font-weight="300"
    fill="#9B7D5A"
    text-anchor="middle"
    letter-spacing="6"
  >Beauty House</text>
</svg>
